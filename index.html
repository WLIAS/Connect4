<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Connect 4</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Main menu -->
    <section id="screen-menu" class="screen screen--active" aria-label="Main menu">
      <h1 class="title">Connect 4</h1>
      <div class="menu-buttons">
        <button type="button" class="btn btn--primary" id="btn-start">Start Game</button>
        <button type="button" class="btn btn--secondary" id="btn-options">Options</button>
      </div>
    </section>

    <!-- Options -->
    <section id="screen-options" class="screen" aria-label="Options" hidden>
      <h2 class="subtitle">Options</h2>
      <div class="options-panel">
        <fieldset class="option-group">
          <legend>Piece colours</legend>
          <label class="radio-row">
            <input type="radio" name="colour-scheme" value="red-yellow" checked />
            <span>Red &amp; Yellow</span>
          </label>
          <label class="radio-row">
            <input type="radio" name="colour-scheme" value="black-white" />
            <span>Black &amp; White</span>
          </label>
        </fieldset>
        <fieldset class="option-group">
          <legend>Timer mode</legend>
          <label class="toggle-row">
            <input type="checkbox" id="opt-timer-enabled" />
            <span>Enable timer mode</span>
          </label>
          <div class="timer-minutes" id="timer-minutes-wrap">
            <label for="opt-timer-minutes">Time per player (minutes)</label>
            <div class="slider-row">
              <input type="range" id="opt-timer-minutes" min="2" max="60" value="5" step="1" />
              <output id="opt-timer-minutes-out" for="opt-timer-minutes">5</output>
            </div>
            <p class="hint">Each player gets the same total time. Running out loses the game.</p>
          </div>
        </fieldset>
      </div>
      <button type="button" class="btn btn--primary" id="btn-options-back">Back</button>
    </section>

    <!-- Game -->
    <section id="screen-game" class="screen" aria-label="Game" hidden>
      <header class="game-header">
        <div class="timers" id="timers" hidden>
          <div class="timer timer--p1" id="timer-p1" aria-live="polite">
            <span class="timer__label">Player 1</span>
            <span class="timer__value" id="timer-p1-value">5:00</span>
          </div>
          <div class="timer timer--p2" id="timer-p2" aria-live="polite">
            <span class="timer__label">Player 2</span>
            <span class="timer__value" id="timer-p2-value">5:00</span>
          </div>
        </div>
        <div class="turn-banner" id="turn-banner">
          <span id="turn-text">Player 1</span>
          <span class="turn-swatch" id="turn-swatch" aria-hidden="true"></span>
        </div>
      </header>

      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="Connect 4 board">
          <!-- Columns generated by JS -->
        </div>
      </div>

      <div class="game-actions">
        <button type="button" class="btn btn--ghost" id="btn-undo" disabled>Undo</button>
        <button type="button" class="btn btn--secondary" id="btn-game-menu">Main menu</button>
      </div>
    </section>
  </div>

  <!-- Game over modal -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title" class="modal__title">Game over</h2>
      <p id="modal-message" class="modal__message"></p>
      <div class="modal__actions">
        <button type="button" class="btn btn--primary" id="modal-play-again">Play again</button>
        <button type="button" class="btn btn--secondary" id="modal-main-menu">Main menu</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
